[project]
name = "tokenrail"
version = "1.0.0"
description = "Thin client and batch execution helpers for OpenAI Responses API workloads."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Takumi Shibata" },
]
requires-python = ">=3.10"
keywords = [
    "openai",
    "responses-api",
    "batch",
    "llm",
    "rate-limit",
    "token",
    "cost-tracking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.108.0",
]

[project.urls]
Homepage = "https://github.com/takumi0shibata/tokenrail"
Repository = "https://github.com/takumi0shibata/tokenrail"
Issues = "https://github.com/takumi0shibata/tokenrail/issues"
Changelog = "https://github.com/takumi0shibata/tokenrail/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenrail"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
