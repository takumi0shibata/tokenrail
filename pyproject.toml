[project]
name = "tokenrail"
version = "0.2.1"
description = "Thin client and batch execution helpers for OpenAI and local LLM workloads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.108.0",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.19.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "transformers>=5.5.0",
]

[project.scripts]
sample = "tokenrail.sample_cli:main"
tokenrail-sample = "tokenrail.sample_cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenrail"]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.2",
]
